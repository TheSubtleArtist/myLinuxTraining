---

- hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Create user "student"
      user:
        name: student
        state: present
        shell: /bin/bash
        groups: wheel
        append: yes
        create_home: yes
    - name: Generate SSH key for "student"
      user:
        name: student
        generate_ssh_key: yes
        ssh_key_bits: 2048
        ssh_key_file: .ssh/id_rsa
    - name: Set correct key permissions
      file:
        path: /home/student/.ssh/id_rsa
        mode: 0600
        owner: student
        group: student
    - name: Install Ansible
      yum:
        name: 
          - ansible
          - python3-pip
        state: present
    - name: Clone myLinuxTraining repository
      git:
        repo: https://github.com/TheSubtleArtist/myLinuxTraining.git
        dest: /home/student/myLinuxTraining